# FleetMesh DRAFT: the traffic the fleet does not control, and the company's receivers and
# sensors (crates/fleetmesh-traffic, docs/design/traffic.md). ILLUSTRATIVE: geometry is close to
# the real Golden Gate and Bay (runway thresholds, the traffic separation scheme, the Golden Gate
# and Central Bay traffic lanes, ferry terminals), rates are plausible for a Sunday morning in
# June, and every name, call sign, address and MMSI is invented. Sources: the crate's README.
#
# Route points are [lat, lon], [lat, lon, alt_ft, kt] or [lat, lon, alt_ft, kt, hold_s]; a
# negative altitude is on the ground or water at that height (ft). Relative paths resolve
# against this file's directory.

[world]
lat_min = 37.45
lat_max = 38.05
lon_min = -122.90
lon_max = -122.10
# Pacific daylight time
utc_offset_h = -7
qnh_hpa = 1016.0
# schedules start four hours early, so the world starts warm
warmup_s = 14400
horizon_s = 172800
# geoid height above the WGS84 ellipsoid on the Bay (EGM96): Remote ID's geodetic altitude is
# above the ellipsoid, so a drone 96 m above mean sea level reports 64 m
geoid_n_m = -32.0

[addresses]
# Privacy ICAO Addresses (FAA PIA): one contiguous block, a fresh address every flight, and a
# third-party callsign in place of the registration. Illustrative: the FAA does not publish its
# pool; a tracker flags an address in this block as anonymous (fleetmesh-tracker's
# anonymous_icao_ranges). UAT anonymous mode is separate: a self-assigned address, written
# with a `~` on the SBS stream.
pia_block = [0xADF800, 0xADFBFF]
pia_callsign_prefix = "XPV"
# US government and military aircraft (the Coast Guard helicopter)
military_block = [0xAE0000, 0xAFFFFF]

[terrain]
# the headless link emulator's baked surface grid (max of elevation and water level, 20 m)
grid = "terrain/golden-gate.grid.gz"
k = 1.3333
sample_m = 60.0

