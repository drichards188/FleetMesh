# --- Equipage by class. ADS-B Out is required in the Mode C veil (14 CFR 91.225), so few
# aircraft have none; UAT is common in light aircraft. AIS Class A is required on the larger
# vessels (33 CFR 164.46); Class B is voluntary on small ones. Remote ID (14 CFR 89) on most
# drones now, not all.

[equipage.airliner]
adsb_1090 = 1.0
[equipage.bizjet]
adsb_1090 = 1.0
pia = 0.10
ladd = 0.35
[equipage.ga]
adsb_1090 = 0.55
uat = 0.40
mode_s_only = 0.02
pia = 0.01
ladd = 0.03
uat_anon = 0.15
[equipage.helicopter]
adsb_1090 = 0.70
uat = 0.27
mode_s_only = 0.01
ladd = 0.05
[equipage.seaplane]
adsb_1090 = 0.50
uat = 0.50
[equipage.drone]
rid = 0.85
[equipage.cargo]
ais_a = 1.0
[equipage.tanker]
ais_a = 1.0
[equipage.passenger]
ais_a = 1.0
[equipage.ferry]
ais_a = 1.0
[equipage.tug]
ais_a = 1.0
[equipage.pilot]
ais_a = 1.0
[equipage.fishing]
ais_a = 0.30
ais_b = 0.35
