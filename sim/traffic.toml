# --- Deep-draft ships. The traffic separation scheme off San Francisco (33 CFR 167.400-.406,
# lane centres between the published boundaries), the pilot station near the centre of the
# precautionary area, the bar channel, the Golden Gate and Central Bay traffic lanes
# (33 CFR 165.1181): inbound south of Alcatraz, outbound north of it, the deep water lane
# north towards Richmond.

