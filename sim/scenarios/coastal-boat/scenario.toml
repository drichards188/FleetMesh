brief = """
Boats from the Pier 39 hub with drones and a plane in the same harbour. One boat carries a 40 kg supply parcel to a vessel anchored about 28 km west, out through the Golden Gate; another takes a smaller parcel to a mooring at Sausalito.

The route meets the real ebb and flood through the Gate and the Potato Patch shoal at low water. Out past Point Bonita the boat leaves cellular range and fails over to its satellite link. Near the port, a jammer degrades the fleet's GNSS, and later a spoof walks one boat's position away from the truth.

The question it asks: with slow vehicles, a changing current, a link that changes radio and a position fix under attack, can the operator tell what is wrong and what to do?
"""

