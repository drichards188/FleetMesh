brief = """
A normal hour on the north San Francisco waterfront, from the Marina to Fisherman's Wharf, with crossings to Sausalito and Angel Island. Two hubs: the Marina's (drones, cars and the planes) and Pier 39's (drones and boats).

Parcels come in about three a minute at full size, from 0.2 to 4 kg, to about 40 approved delivery points. Most need no one: automation sends them, waits out a crowded drop zone and keeps clear of other traffic, and tells you what it cannot settle.

The question it asks: how many decisions does one person face in an hour when most things go well?
"""

