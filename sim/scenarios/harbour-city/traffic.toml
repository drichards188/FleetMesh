# harbour-city: the other traffic for a normal Sunday hour on the north waterfront
# (crates/fleetmesh-traffic; the world is sim/traffic.toml). Times are scenario seconds.
name = "harbour-city"
seed = 11
at = "2026-06-14T17:00:00Z"
duration_s = 3600

# The world's QNH at the scenario's hour: the weather archive's sea-level pressure
# (tidewater/data/cache/golden-gate-2026-06/weather.json, 2026-06-14 17:00Z), the QNH the bridge
# reads from the same archive, so the pressure altitudes the receivers hear agree with it.
qnh_hpa = 1014.5

# The Pier hub's ground radar is on: it sees the aircraft round the waterfront where they are,
# which is what shows a broadcast position to be wrong (the drones' detect-and-avoid gives bearings
# only).
ground_radar = ["radar-pier"]

# a normal hour: the world's rates as they are
[rates]

# A hobby drone with no Remote ID over Marina Green, next to the Marina car hub: only the
# drones' own detect-and-avoid can see it.
[[issue]]
kind = "drone_no_rid"
name = "unidentified drone at Marina Green"
at_s = 360
duration_s = 900
lat = 37.8063
lon = -122.4385
ground_m = 3
agl_m = 70

# A medical helicopter crossing the waterfront low (400 ft) from the city out over the Bay, across
# the drones' routes east of the Marina hub: automation keeps the drones its path will reach on the
# ground or holds them where they are until it has passed, and no person is asked.
[[issue]]
kind = "flight"
name = "medical helicopter crossing the waterfront low"
at_s = 360
stream = "medevac"
class = "helicopter"
route = [[37.7900, -122.4320, 400, 70], [37.8250, -122.4320, 400, 70], [37.8600, -122.4000, 1500, 110]]

# A container ship for Oakland passing under the Golden Gate Bridge, then along the Cityfront.
[[issue]]
kind = "ship_arrival"
name = "container ship for Oakland"
at_s = 960
stream = "ships-oakland"
class = "cargo"
vessel_name = "ORIENT HARMONY"

# A tour helicopter whose ADS-B position is 700 m off for ten minutes (a faulty navigation
# source): its broadcasts disagree with what the drones' own sensors see.
[[issue]]
kind = "adsb_bad_position"
name = "tour helicopter broadcasting a wrong position"
at_s = 960
duration_s = 600
stream = "heli-tour"
class = "helicopter"
offset_m = 700
bearing_deg = 60

# The Pier dock hub's AIS receiver goes down for ten minutes.
[[issue]]
kind = "receiver_down"
name = "hub-pier AIS receiver down"
at_s = 1860
duration_s = 600
receiver = "hub-pier"
sensor = "ais"
