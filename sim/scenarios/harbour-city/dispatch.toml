# harbour-city: a mixed fleet from two hubs on the north San Francisco waterfront. Illustrative only.

[dispatch]
tick_s = 10
max_range_frac = 0.7
hold_reassign_s = 120
max_proposals_per_min = 60

# What automation does before a person is told (the bridge's, not a rule; docs/design/delivery-orders.md
# section 5.2). These are the defaults, written out.
[automation]
depart_wait_s = 120     # loaded at the hub: wait this long for the drop zone to look clear
hover_wait_s = 120      # over the zone: wait this long for a clear look, then keep the parcel and come home
retry_after_s = 600     # a parcel kept undelivered is tried again after this
max_tries = 2           # ... this many times in all
hold_retry_s = 15       # a hold automation waits out (traffic near the hub, a stale fact) is tried again after this
hold_retry_max_s = 300  # ... and goes to a person after this much waiting
issue_show_s = 300      # an issue alert stays in the inbox this long

[observations.busy]
doorstep = 0.25
kerb = 0.15
locker = 0.0
pad = 0.0
dock = 0.0

# two parcels to the hub's own pad: a confirmed zone, so policy sends the delivery at once
[[parcel]]
id = "p-pad-1"
from = "hub-marina"
to = "dz-marina-pad"
mass_kg = 0.5
ready_s = 15
due_s = 1200
priority = 2

[[parcel]]
id = "p-pad-2"
from = "hub-marina"
to = "dz-marina-pad"
mass_kg = 1.0
ready_s = 120
due_s = 1200
priority = 1

# seeded demand: about 3 parcels a minute for the hour
[demand]
rate_per_min = 3.0
from_s = 30
# the Marina's drone pads and the Pier's take most (23 and 9 in 40), the Marina's car kerb 7 in 40
# and the Pier's boat dock 1 in 40, each to the zones its vehicles reach: a boat's run across the
# Bay takes most of an hour each way at its 3 m/s, so four boats carry about five parcels an hour
hubs = [
  "hub-marina", "hub-marina", "hub-marina", "hub-marina", "hub-marina", "hub-marina", "hub-marina", "hub-marina",
  "hub-marina", "hub-marina", "hub-marina", "hub-marina", "hub-marina", "hub-marina", "hub-marina", "hub-marina",
  "hub-marina", "hub-marina", "hub-marina", "hub-marina", "hub-marina", "hub-marina", "hub-marina",
  "hub-pier", "hub-pier", "hub-pier", "hub-pier", "hub-pier", "hub-pier", "hub-pier", "hub-pier", "hub-pier",
  "hub-marina-kerb", "hub-marina-kerb", "hub-marina-kerb", "hub-marina-kerb", "hub-marina-kerb", "hub-marina-kerb", "hub-marina-kerb",
  "hub-pier-dock",
]
zones_by_hub = { "hub-marina-kerb" = ["dz-fort-mason-3", "dz-city-02", "dz-city-04", "dz-city-05", "dz-city-06", "dz-city-08", "dz-city-11", "dz-city-13", "dz-city-14", "dz-city-20"], "hub-pier-dock" = ["dz-sausalito-dock", "dz-angel-dock"] }
zones = ["dz-fort-mason-3", "dz-city-02", "dz-city-03", "dz-city-04", "dz-city-05", "dz-city-06", "dz-city-07", "dz-city-08", "dz-city-09", "dz-city-10", "dz-city-11", "dz-city-12", "dz-city-13", "dz-city-14", "dz-city-15", "dz-city-16", "dz-city-17", "dz-city-18", "dz-city-19", "dz-city-20", "dz-city-21", "dz-city-22", "dz-sausalito-pad", "dz-sausalito-dock", "dz-angel-dock"]
mass_kg = [0.2, 4.0]
# what each base's vehicles carry: the Pier's drone pads take drone-sized parcels; the Marina's
# (with its planes, and its car kerb beside it) some up to 2.6 kg, near or over a drone's limit, which
# the dispatcher gives a plane or a car; the kerb and the dock heavier ones
mass_by_hub = { "hub-marina" = [0.2, 2.6], "hub-pier" = [0.2, 2.0], "hub-marina-kerb" = [0.5, 10.0], "hub-pier-dock" = [0.5, 15.0] }
priority_mix = [0.02, 0.60, 0.30, 0.08]
due_s = 1800
# a boat's parcel is due in an hour and a half (its run across the Bay)
due_by_hub = { "hub-pier-dock" = 5400 }

# Marina Green's pads reach 120 m from its point: its 24 drones stand in a row 5 m apart east of it,
# and its planes beside them (each vehicle's stand is where it was launched, and it lands there again)
[[hub]]
id = "hub-marina"
name = "Marina Green hub"
lon = -122.437
lat = 37.8057
radius_m = 120
pads = 12
packs = 16

[[hub]]
id = "hub-pier"
name = "Pier 39 hub"
lon = -122.41
lat = 37.8089
radius_m = 80
pads = 8
packs = 10

# The Marina's cars load at their own kerb on Marina Boulevard, clear of the drone pads (a car
# routed to the drones' hub point drove through the landed drones, and the separation rule refused
# its pickups), and the Pier's boats at the dock in the marina basin east of Pier 39 (the drones'
# hub point is on the pier, on land, and the domain rule refused a boat's pickup there).
# the kerb's 8 bays run 42 m east along Marina Boulevard, and its lane out of them 80 m
[[hub]]
id = "hub-marina-kerb"
name = "Marina car kerb"
lon = -122.4360
lat = 37.8045
radius_m = 80
pads = 8
packs = 8

# the boats' berths in open water off Pier 39's north-east corner, 8 to 10 m deep, from which a
# straight run to Sausalito and to Angel Island crosses no land
[[hub]]
id = "hub-pier-dock"
name = "Pier 39 boat dock"
lon = -122.4080
lat = 37.8102
radius_m = 60
pads = 4
packs = 4

# Sites: the bases (hubs) that work together at one place, for the console's Fleet list and map
# (docs/design/fleet-organisation.md); the Marina's drone pads and its car kerb, the Pier's drone pads
# and its boat dock. Nothing the rules or the dispatcher read.
[[site]]
id = "marina"
name = "Marina"
hubs = ["hub-marina", "hub-marina-kerb"]

[[site]]
id = "pier-39"
name = "Pier 39"
hubs = ["hub-pier", "hub-pier-dock"]

