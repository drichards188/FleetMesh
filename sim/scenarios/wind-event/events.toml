# wind-event: scripted gusts over the archive's mean wind (a gust ramp through the drone limits:
# soft 11 m/s, hard 14 m/s). The scripted gust reaches the rules, not the vehicles' physics.

[weather]
wind_east_mps = 4.0
wind_north_mps = 1.0
visibility_m = 15000
archive = "tidewater/data/cache/golden-gate-2026-06/weather.json"

# The arc, compressed so a run starts on it (linear between frames, the last held): the soft limit
# (11 m/s) is crossed at about 55 s, the hard limit (14) at about 465 s, back under the hard limit at
# about 677 s and under the soft limit at about 885 s; the rest of the run is the backlog draining.
[[weather.timeline]]
at_s = 0.0
values = { gust_mps = 7.0 }
[[weather.timeline]]
at_s = 20.0
values = { gust_mps = 7.5 }
[[weather.timeline]]
at_s = 70.0
values = { gust_mps = 12.5 }
[[weather.timeline]]
at_s = 420.0
values = { gust_mps = 13.5 }
[[weather.timeline]]
at_s = 600.0
values = { gust_mps = 15.5 }
[[weather.timeline]]
at_s = 780.0
values = { gust_mps = 12.0 }
[[weather.timeline]]
at_s = 1200.0
values = { gust_mps = 8.0 }
