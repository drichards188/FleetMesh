# wind-event: one hub, forty drones, a gust ramp through the drone limits. Illustrative only.

[dispatch]
tick_s = 10
max_range_frac = 0.7
hold_reassign_s = 120
max_proposals_per_min = 60

[observations.busy]
doorstep = 0.2
kerb = 0.1

[demand]
rate_per_min = 6.0
from_s = 30
hubs = ["hub-crissy"]
zones = ["dz-wind-01", "dz-wind-02", "dz-wind-03", "dz-wind-04", "dz-wind-05", "dz-wind-06", "dz-wind-07", "dz-wind-08", "dz-wind-09", "dz-wind-10", "dz-wind-11", "dz-wind-12", "dz-wind-13", "dz-wind-14", "dz-wind-15", "dz-wind-16", "dz-wind-17", "dz-wind-18", "dz-wind-19", "dz-wind-20", "dz-wind-21", "dz-wind-22", "dz-wind-23", "dz-wind-24", "dz-wind-25", "dz-wind-26", "dz-wind-27", "dz-wind-28", "dz-wind-29", "dz-wind-30", "dz-crissy-pad"]
