[package]
name = "fleetmesh-traffic"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The traffic FleetMesh does not control (airliners, helicopters, seaplanes, other drones, ships, ferries, small craft), the company's receivers and sensors observing it, and what they emit in real wire formats (SBS-1, NMEA AIVDM, JSON lines)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "fleetmesh-traffic"
path = "src/main.rs"

[dependencies]
# The scenario clock every FleetMesh process reads (FLEETMESH_AT, FLEETMESH_RATE).
fleetmesh-space = { path = "../fleetmesh-space" }
# The link emulator's terrain line of sight (terrain::path_obstruction_m), reused for radio paths.
fleetmesh-linkemu = { path = "../fleetmesh-linkemu" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng"] }
rand_chacha = "0.9"
# The baked surface grid (sim/terrain/*.grid.gz) is gzip.
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "signal", "io-util", "sync"] }
axum = "0.8.9"

[lints]
workspace = true
